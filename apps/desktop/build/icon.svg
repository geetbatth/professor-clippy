<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 512 512" width="512" height="512">
  <!-- Professor Clippy peeking over a sticky note: the app icon. A head-and-goggles crop of the
       idle sprite (src/renderer/src/clippy/sprites/idle.webp) on the yellow note. Rasterised to
       icon.png / icon.ico by scripts/make-icons.mjs, which inlines the sprite (an SVG drawn as an
       image can't load files). -->
  <defs>
    <linearGradient id="note" x1="0" y1="0" x2="0.15" y2="1">
      <stop offset="0" stop-color="#fff9a8"/>
      <stop offset="1" stop-color="#ffe45c"/>
    </linearGradient>
    <clipPath id="noteClip">
      <rect x="20" y="20" width="472" height="472" rx="64"/>
    </clipPath>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#5a4a08" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- The note -->
  <rect x="20" y="28" width="472" height="472" rx="64" fill="#7a6410" opacity="0.28"/>
  <rect x="20" y="20" width="472" height="472" rx="64" fill="url(#note)" stroke="#d9b42a" stroke-width="4"/>

  <!-- His head, goggles and mortarboard, the canister rim cut off by the bottom edge -->
  <g clip-path="url(#noteClip)">
    <svg x="20" y="20" width="472" height="472" viewBox="248 -4 192 192" filter="url(#shadow)">
      <image href="../src/renderer/src/clippy/sprites/idle.webp" x="0" y="0" width="516" height="689"/>
    </svg>
  </g>

  <!-- The curled-up corner -->
  <path d="M 420 492 L 492 420 L 492 428 Q 492 492 428 492 Z" fill="#e7c63a"/>
</svg>
